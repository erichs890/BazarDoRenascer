<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Bazar do Renascer — bazar beneficente de roupas doadas. Compre peças com história ou doe direto para quem precisa." />
    <meta name="theme-color" content="#013857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08202C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bazar do Renascer" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <title>Bazar do Renascer</title>
    <!-- Tema antes da primeira pintura (sem "piscar" claro no modo escuro).
         Padrão: o do sistema; o botão de tema salva a escolha. Ver src/lib/theme.js -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('bazar:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
